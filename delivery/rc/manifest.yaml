schema_version: '1.0'
component: Administering
package: administering/admin
namespace: App\Administering
rc_stage: 3RC-candidate
proof_profile: administering-rolling-accessing-runtime
purpose: Owner-facing, machine-readable 3RC proof manifest for the Administering + Rolling + Accessing connection. The manifest
  defines the canonical proof commands, expected runtime artifacts, pass/fail contract, bootstrap prerequisites, and known
  boundary for the RC gate.
components:
- name: Administering
  role: admin UI, operation orchestration, runtime proof aggregation
  package: administering/admin
  namespace: App\Administering
- name: Rolling
  role: administration permission catalog, ACL sync, Doctrine-backed permission decision
  package: rolling/role
  namespace: App\Rolling
- name: Accessing
  role: account/subject integration surface
  package: accessing/access
  namespace: App\Accessing
storage_contract:
  system_storage: SQLite/system Entity Manager
  user_storage: PostgreSQL/user-business Entity Manager
  required_system_tables:
  - administration_*
  - rolling_*
bootstrap_commands:
- name: Rolling administration catalog sync
  command: php bin/console rolling:administration:catalog:sync --json
  required_before_fresh_system_proof: true
- name: Bootstrap Symfony user subject
  command: php bin/console rolling:administration:catalog:sync --bootstrap-user-identifier=admin@example.com --json
  required_before_operator_ui_use: true
- name: Bootstrap Accessing account subject
  command: php bin/console rolling:administration:catalog:sync --bootstrap-accessing-account-id=123 --json
  required_before_accessing_subject_ui_use: false
proof_commands:
  aggregate:
    name: Administering aggregate RC proof
    command: php bin/console administering:rc:proof --operation-type=administration.configuration.scan --target-prefix=administering:rc-proof
      --output-file=delivery/rc/runtime-proof-results/administering-rc-proof.json --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - ready
    - commands
    - errors
  artifact_validation:
    name: Administering RC proof artifact validation
    command: php bin/console administering:rc:proof-artifact:validate --proof-file=delivery/rc/runtime-proof-results/administering-rc-proof.json
      --index-file=delivery/rc/runtime-proof-results/administering-rc-proof-index.json --manifest-file=delivery/rc/manifest.yaml
      --output-file=delivery/rc/runtime-proof-results/administering-rc-proof-validation.json --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - valid
    - checks
    - errors
  owner_review:
    name: Administering 3RC owner-review verdict
    command: php bin/console administering:rc:owner-review --proof-file=delivery/rc/runtime-proof-results/administering-rc-proof.json
      --index-file=delivery/rc/runtime-proof-results/administering-rc-proof-index.json --validation-file=delivery/rc/runtime-proof-results/administering-rc-proof-validation.json
      --manifest-file=delivery/rc/manifest.yaml --output-file=delivery/rc/runtime-proof-results/administering-rc-owner-review.json
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - ready_for_owner_review
    - artifacts.manifest_sha256
    - artifacts.proof_sha256
    - artifacts.index_sha256
    - artifacts.validation_sha256
    - checks
    - errors
  final_seal:
    name: Administering 3RC final seal
    command: php bin/console administering:rc:final-seal --proof-file=delivery/rc/runtime-proof-results/administering-rc-proof.json
      --index-file=delivery/rc/runtime-proof-results/administering-rc-proof-index.json --validation-file=delivery/rc/runtime-proof-results/administering-rc-proof-validation.json
      --owner-review-file=delivery/rc/runtime-proof-results/administering-rc-owner-review.json --manifest-file=delivery/rc/manifest.yaml
      --output-file=delivery/rc/runtime-proof-results/administering-rc-final-seal.json --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - sealed_3rc_candidate
    - checks
    - errors
  final_seal_validation:
    name: Administering 3RC final-seal validation
    command: php bin/console administering:rc:final-seal:validate --final-seal-file=delivery/rc/runtime-proof-results/administering-rc-final-seal.json
      --proof-file=delivery/rc/runtime-proof-results/administering-rc-proof.json --index-file=delivery/rc/runtime-proof-results/administering-rc-proof-index.json
      --validation-file=delivery/rc/runtime-proof-results/administering-rc-proof-validation.json --owner-review-file=delivery/rc/runtime-proof-results/administering-rc-owner-review.json
      --manifest-file=delivery/rc/manifest.yaml --output-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - final_seal_valid
    - artifacts.final_seal_sha256
    - checks
    - errors
  rc_status:
    name: Administering 3RC status summary
    command: php bin/console administering:rc:status --manifest-file=delivery/rc/manifest.yaml --proof-file=delivery/rc/runtime-proof-results/administering-rc-proof.json
      --index-file=delivery/rc/runtime-proof-results/administering-rc-proof-index.json --validation-file=delivery/rc/runtime-proof-results/administering-rc-proof-validation.json
      --owner-review-file=delivery/rc/runtime-proof-results/administering-rc-owner-review.json --final-seal-file=delivery/rc/runtime-proof-results/administering-rc-final-seal.json
      --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json --output-file=delivery/rc/runtime-proof-results/administering-rc-status.json
      --summary-file=delivery/rc/runtime-proof-results/administering-rc-status-summary.txt --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - sealed_3rc_validated
    - artifact_status
    - artifacts.final_seal_validation_sha256
    - checks
    - errors
  sections:
  - name: Runtime readiness
    command: php bin/console administering:runtime:readiness --json
    required: true
  - name: Synchronous operation lifecycle proof
    command: php bin/console administering:operation:lifecycle-proof --operation-type=administration.configuration.scan --target=administering:rc-proof:lifecycle
      --json
    required: true
  - name: Messenger boundary proof
    command: php bin/console administering:operation:messenger-boundary-proof --operation-type=administration.configuration.scan
      --target=administering:rc-proof:messenger-boundary --json
    required: true
  proof_index:
    name: Administering RC proof index capture
    command: php bin/console administering:rc:proof-index --proof-file=delivery/rc/runtime-proof-results/administering-rc-proof.json
      --manifest-file=delivery/rc/manifest.yaml --output-file=delivery/rc/runtime-proof-results/administering-rc-proof-index.json
      --operation-type=administration.configuration.scan --target-prefix=administering:rc-proof --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - operation_type
    - target_prefix
    - manifest_sha256
    - proof_sha256
    - errors
  rc_receipt:
    name: Administering 3RC owner receipt
    command: php bin/console administering:rc:receipt --manifest-file=delivery/rc/manifest.yaml --status-file=delivery/rc/runtime-proof-results/administering-rc-status.json
      --status-summary-file=delivery/rc/runtime-proof-results/administering-rc-status-summary.txt --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --output-file=delivery/rc/runtime-proof-results/administering-rc-receipt.json --text-file=delivery/rc/runtime-proof-results/administering-rc-receipt.txt
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - receipt_ready
    - receipt_fingerprint
    - source_artifacts.status_sha256
    - errors
  rc_receipt_validation:
    name: Administering 3RC owner receipt validation
    command: php bin/console administering:rc:receipt:validate --manifest-file=delivery/rc/manifest.yaml --status-file=delivery/rc/runtime-proof-results/administering-rc-status.json
      --status-summary-file=delivery/rc/runtime-proof-results/administering-rc-status-summary.txt --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --receipt-file=delivery/rc/runtime-proof-results/administering-rc-receipt.json --receipt-text-file=delivery/rc/runtime-proof-results/administering-rc-receipt.txt
      --output-file=delivery/rc/runtime-proof-results/administering-rc-receipt-validation.json --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - receipt_valid
    - artifacts.receipt_sha256
    - artifacts.receipt_text_sha256
    - checks
    - errors
  rc_final_status:
    name: Administering final 3RC status including receipt validation
    command: php bin/console administering:rc:status --manifest-file=delivery/rc/manifest.yaml --proof-file=delivery/rc/runtime-proof-results/administering-rc-proof.json
      --index-file=delivery/rc/runtime-proof-results/administering-rc-proof-index.json --validation-file=delivery/rc/runtime-proof-results/administering-rc-proof-validation.json
      --owner-review-file=delivery/rc/runtime-proof-results/administering-rc-owner-review.json --final-seal-file=delivery/rc/runtime-proof-results/administering-rc-final-seal.json
      --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json --receipt-file=delivery/rc/runtime-proof-results/administering-rc-receipt.json
      --receipt-text-file=delivery/rc/runtime-proof-results/administering-rc-receipt.txt --receipt-validation-file=delivery/rc/runtime-proof-results/administering-rc-receipt-validation.json
      --include-receipt-artifacts --output-file=delivery/rc/runtime-proof-results/administering-rc-final-status.json --summary-file=delivery/rc/runtime-proof-results/administering-rc-final-status-summary.txt
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - sealed_3rc_validated
    - include_receipt_artifacts
    - artifact_status.receipt_validation
    - artifacts.receipt_validation_sha256
    - checks
    - errors
  rc_final_status_validation:
    name: Administering final 3RC status validation
    command: php bin/console administering:rc:final-status:validate --manifest-file=delivery/rc/manifest.yaml --final-status-file=delivery/rc/runtime-proof-results/administering-rc-final-status.json
      --final-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-final-status-summary.txt --receipt-file=delivery/rc/runtime-proof-results/administering-rc-receipt.json
      --receipt-text-file=delivery/rc/runtime-proof-results/administering-rc-receipt.txt --receipt-validation-file=delivery/rc/runtime-proof-results/administering-rc-receipt-validation.json
      --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json --output-file=delivery/rc/runtime-proof-results/administering-rc-final-status-validation.json
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - final_status_valid
    - artifacts.final_status_sha256
    - artifacts.receipt_validation_sha256
    - checks
    - errors
  rc_handoff_index:
    name: Administering terminal 3RC handoff index
    command: php bin/console administering:rc:handoff-index --manifest-file=delivery/rc/manifest.yaml --final-status-file=delivery/rc/runtime-proof-results/administering-rc-final-status.json
      --final-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-final-status-summary.txt --final-status-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-status-validation.json
      --receipt-file=delivery/rc/runtime-proof-results/administering-rc-receipt.json --receipt-text-file=delivery/rc/runtime-proof-results/administering-rc-receipt.txt
      --receipt-validation-file=delivery/rc/runtime-proof-results/administering-rc-receipt-validation.json --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --output-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.json --text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.txt
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - handoff_index_ready
    - hashes.final_status_validation_sha256
    - terminal_artifacts
    - checks
    - errors
  rc_handoff_index_validation:
    name: Administering terminal 3RC handoff index validation
    command: php bin/console administering:rc:handoff-index:validate --manifest-file=delivery/rc/manifest.yaml --final-status-file=delivery/rc/runtime-proof-results/administering-rc-final-status.json
      --final-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-final-status-summary.txt --final-status-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-status-validation.json
      --receipt-file=delivery/rc/runtime-proof-results/administering-rc-receipt.json --receipt-text-file=delivery/rc/runtime-proof-results/administering-rc-receipt.txt
      --receipt-validation-file=delivery/rc/runtime-proof-results/administering-rc-receipt-validation.json --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --handoff-index-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.json --handoff-index-text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.txt
      --output-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index-validation.json --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - handoff_index_valid
    - artifacts.handoff_index_sha256
    - artifacts.handoff_index_text_sha256
    - checks
    - errors
  terminal_status:
    name: Administering terminal 3RC status including handoff validation
    command: php bin/console administering:rc:status --include-receipt-artifacts --include-handoff-artifacts --output-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status.json
      --summary-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-summary.txt --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - sealed_3rc_validated
    - include_handoff_artifacts
    - artifact_status.handoff_index_validation
    - artifacts.handoff_index_validation_sha256
    - errors
  terminal_status_validation:
    name: Administering terminal 3RC status validation
    command: php bin/console administering:rc:terminal-status:validate --manifest-file=delivery/rc/manifest.yaml --terminal-status-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status.json
      --terminal-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-summary.txt --handoff-index-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.json
      --handoff-index-text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.txt --handoff-index-validation-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index-validation.json
      --final-status-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-status-validation.json --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --output-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-validation.json --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - terminal_status_valid
    - artifacts.terminal_status_sha256
    - artifacts.handoff_index_validation_sha256
    - checks
    - errors
  rc_handoff_bundle:
    name: Administering terminal 3RC handoff bundle manifest
    command: php bin/console administering:rc:handoff-bundle --manifest-file=delivery/rc/manifest.yaml --terminal-status-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status.json
      --terminal-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-summary.txt --terminal-status-validation-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-validation.json
      --handoff-index-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.json --handoff-index-text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.txt
      --handoff-index-validation-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index-validation.json --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --output-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.json --text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.txt
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - handoff_bundle_ready
    - artifacts
    - checks
    - errors
  rc_handoff_bundle_validation:
    name: Administering terminal 3RC handoff bundle validation
    command: php bin/console administering:rc:handoff-bundle:validate --manifest-file=delivery/rc/manifest.yaml --terminal-status-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status.json
      --terminal-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-summary.txt --terminal-status-validation-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-validation.json
      --handoff-index-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.json --handoff-index-text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.txt
      --handoff-index-validation-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index-validation.json --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --handoff-bundle-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.json --handoff-bundle-text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.txt
      --output-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle-validation.json --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - handoff_bundle_valid
    - artifacts.handoff_bundle_sha256
    - artifacts.handoff_bundle_text_sha256
    - checks
    - errors
  rc_bundle_status:
    name: Administering bundle-aware terminal 3RC status
    command: php bin/console administering:rc:status --include-receipt-artifacts --include-handoff-artifacts --include-handoff-bundle-artifacts
      --output-file=delivery/rc/runtime-proof-results/administering-rc-bundle-status.json --summary-file=delivery/rc/runtime-proof-results/administering-rc-bundle-status-summary.txt
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - sealed_3rc_validated
    - artifact_status.handoff_bundle
    - artifact_status.handoff_bundle_validation
    - artifacts.handoff_bundle_sha256
    - artifacts.handoff_bundle_validation_sha256
    - checks
    - errors
  rc_acceptance:
    name: Administering 3RC terminal acceptance marker
    command: php bin/console administering:rc:acceptance --manifest-file=delivery/rc/manifest.yaml --bundle-status-file=delivery/rc/runtime-proof-results/administering-rc-bundle-status.json
      --bundle-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-bundle-status-summary.txt --handoff-bundle-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.json
      --handoff-bundle-text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.txt --handoff-bundle-validation-file=delivery/rc/runtime-proof-results/administering-rc-handoff-bundle-validation.json
      --terminal-status-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status.json --terminal-status-summary-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-summary.txt
      --terminal-status-validation-file=delivery/rc/runtime-proof-results/administering-rc-terminal-status-validation.json
      --handoff-index-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.json --handoff-index-text-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index.txt
      --handoff-index-validation-file=delivery/rc/runtime-proof-results/administering-rc-handoff-index-validation.json --final-seal-validation-file=delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
      --output-file=delivery/rc/runtime-proof-results/administering-rc-acceptance.json --text-file=delivery/rc/runtime-proof-results/administering-rc-acceptance.txt
      --json
    success_exit_code: 0
    expected_json_fields:
    - status
    - handoff_accepted
    - artifacts.acceptance.sha256
    - artifacts.acceptance_text.sha256
    - checks
    - errors
composer_scripts:
  rc_contract_validate: composer rc:contract:validate
  rc_proof: composer rc:proof
  rc_proof_index: composer rc:proof:index
  rc_proof_validate: composer rc:proof:validate
  rc_owner_review: composer rc:owner-review
  rc_final_seal: composer rc:final-seal
  rc_final_seal_validate: composer rc:final-seal:validate
  rc_status: composer rc:status
  quality_rc_3rc: composer quality:rc-3rc
  rc_receipt: composer rc:receipt
  rc_receipt_validate: composer rc:receipt:validate
  rc_status_final: composer rc:status:final
  rc_status_final_validate: composer rc:status:final:validate
  rc_handoff_index: composer rc:handoff-index
  rc_handoff_index_validate: composer rc:handoff-index:validate
  rc_status_terminal: composer rc:status:terminal
  rc_status_terminal_validate: composer rc:status:terminal:validate
  rc_handoff_bundle: composer rc:handoff-bundle
  rc_handoff_bundle_validate: composer rc:handoff-bundle:validate
  rc_status_bundle: composer rc:status:bundle
  rc_acceptance: composer rc:acceptance
windows_helper:
  path: tools/runtime/capture-administering-rc-proof.ps1
  command: powershell -ExecutionPolicy Bypass -File tools/runtime/capture-administering-rc-proof.ps1 -ProjectRoot D:\PhpstormProjects\www\Administering
  writes:
  - delivery/rc/runtime-proof-results/administering-rc-proof.json
  - delivery/rc/runtime-proof-results/administering-rc-proof-index.json
  - delivery/rc/runtime-proof-results/administering-rc-proof-validation.json
  - delivery/rc/runtime-proof-results/administering-rc-owner-review.json
  - delivery/rc/runtime-proof-results/administering-rc-final-seal.json
  - delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
  - delivery/rc/runtime-proof-results/administering-rc-status.json
  - delivery/rc/runtime-proof-results/administering-rc-status-summary.txt
  - delivery/rc/runtime-proof-results/administering-rc-receipt.json
  - delivery/rc/runtime-proof-results/administering-rc-receipt.txt
  - delivery/rc/runtime-proof-results/administering-rc-receipt-validation.json
  - delivery/rc/runtime-proof-results/administering-rc-final-status.json
  - delivery/rc/runtime-proof-results/administering-rc-final-status-summary.txt
  - delivery/rc/runtime-proof-results/administering-rc-final-status-validation.json
  - delivery/rc/runtime-proof-results/administering-rc-handoff-index.json
  - delivery/rc/runtime-proof-results/administering-rc-handoff-index.txt
  - delivery/rc/runtime-proof-results/administering-rc-handoff-index-validation.json
  - delivery/rc/runtime-proof-results/administering-rc-terminal-status.json
  - delivery/rc/runtime-proof-results/administering-rc-terminal-status-summary.txt
  - delivery/rc/runtime-proof-results/administering-rc-terminal-status-validation.json
  - delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.json
  - delivery/rc/runtime-proof-results/administering-rc-handoff-bundle.txt
  - delivery/rc/runtime-proof-results/administering-rc-handoff-bundle-validation.json
  - delivery/rc/runtime-proof-results/administering-rc-bundle-status.json
  - delivery/rc/runtime-proof-results/administering-rc-bundle-status-summary.txt
  - delivery/rc/runtime-proof-results/administering-rc-acceptance.json
  - delivery/rc/runtime-proof-results/administering-rc-acceptance.txt
artifacts:
  proof_report: delivery/rc/runtime-proof-results/administering-rc-proof.json
  proof_index: delivery/rc/runtime-proof-results/administering-rc-proof-index.json
  proof_validation: delivery/rc/runtime-proof-results/administering-rc-proof-validation.json
  owner_review: delivery/rc/runtime-proof-results/administering-rc-owner-review.json
  final_seal: delivery/rc/runtime-proof-results/administering-rc-final-seal.json
  final_seal_validation: delivery/rc/runtime-proof-results/administering-rc-final-seal-validation.json
  rc_status: delivery/rc/runtime-proof-results/administering-rc-status.json
  rc_status_summary: delivery/rc/runtime-proof-results/administering-rc-status-summary.txt
