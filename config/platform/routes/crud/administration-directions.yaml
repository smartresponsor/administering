# ---------------------------------------------------------------------------
# Administration CRUD token grammar
# ---------------------------------------------------------------------------
# This file is a route-map registry/protocol file for the Administration parser.
#
# Current Administration CRUD grammar:
#   Classic CRUD:
#     /administration/{resourcePath}/index
#     /administration/{resourcePath}/show/{id}
#     /administration/{resourcePath}/show/{slug}
#     /administration/{resourcePath}/new
#     /administration/{resourcePath}/create
#     /administration/{resourcePath}/edit/{id}
#     /administration/{resourcePath}/edit/{slug}
#     /administration/{resourcePath}/update/{id}
#     /administration/{resourcePath}/update/{slug}
#     /administration/{resourcePath}/delete/{id}
#     /administration/{resourcePath}/delete/{slug}
#     /administration/{resourcePath}/bulk
#     /administration/{resourcePath}/import
#     /administration/{resourcePath}/export
#     /administration/{resourcePath}/archive/{id}
#     /administration/{resourcePath}/archive/{slug}
#     /administration/{resourcePath}/restore/{id}
#     /administration/{resourcePath}/restore/{slug}
#     /administration/{resourcePath}/duplicate/{id}
#     /administration/{resourcePath}/duplicate/{slug}
#
# Token rule:
#   Do not add a second token for symmetry.
#   Add a second token only when it narrows administration meaning.
#
# Token meaning:
#   administration = reserved Administering administration root
#   resourcePath   = slash-aware administration CRUD resource path
#   id             = internal/admin/system identifier
#   slug           = human-readable identifier when explicitly exposed by the map
#
# ID/Slug policy:
#   no {ref}; use {id}/{slug}; use semantic identifiers only for real relations.
#
# Canon:
#   routeKey keeps full administration chain, for example:
#     administration.route.index
#     administration.command.show_id
#
#   service target is physical and must exist under:
#     App\Administering\Service\Http\Administration\...
#
#   form target is physical and must exist under:
#     App\Administering\Form\Administration\...
# ---------------------------------------------------------------------------

