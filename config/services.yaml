parameters:
  administering.product_name: 'Administering'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    App\Administering\ServiceInterface\Admin\AdministrationServiceToolHandlerInterface:
      tags: ['administering.service_tool_handler']
    App\Administering\ServiceInterface\Admin\AdministrationOwnerConfigurationToolProviderInterface:
      tags: ['administering.owner_configuration_tool_provider']
    App\Administering\ServiceInterface\Config\AdministrationConfigToolServiceInterface:
      tags: ['administering.config_tool']

  App\Administering\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/AdministeringBundle.php'

  App\Administering\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  App\Administering\ServiceInterface\Accessing\AdministrationCurrentUserContextProviderInterface: '@App\Administering\Provider\Accessing\SymfonyAdministrationCurrentUserContextProvider'
