# EasyAdmin must load its dashboard/CRUD route map through its own route loader.
# The attribute import below is only for Administering custom Symfony admin pages.
administering_easyadmin:
  resource: .
  type: easyadmin.routes

administering_admin_connected_attribute:
  resource: '../../src/Controller/Admin/Connected/'
  type: attribute

administering_admin_attribute:
  resource: '../../src/Controller/Admin/'
  type: attribute
  exclude:
    - '../../src/Controller/Admin/Connected/'
    - '../../src/Controller/Admin/Surface/AdministrationConnectedComponent*Controller.php'
    - '../../src/Controller/Admin/Surface/AdministrationOperationLaunchController.php'
    - '../../src/Controller/Admin/Surface/AdministrationOperationReportController.php'
    - '../../src/Controller/Admin/Surface/AdministrationOperationRunDetailController.php'
    - '../../src/Controller/Admin/Surface/AdministrationRuntimeSourceIndexController.php'

