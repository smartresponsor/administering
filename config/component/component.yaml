component: Administering
namespace: App\Administering
package: administering/administration
business_stem: Administration
ui_label: Administering
route_prefix: /ea/administration
config_root: administration
database_prefix: administration_

storage:
  entity_manager: system
  primary_database: sqlite
  forbidden_database: postgres_user_data

# Ecosystem topology: WHO owns WHAT.
# This is the only integration knowledge Administering keeps.
# HOW each owner works is declared in the owner's own component.yaml
# and discovered via AdministrationComponentIntegrationContractRegistry.
ownership:
  identity_owner_token: identity
  authorization_owner_token: authorization
  administration_owner: Administering

credentials:
  - key: APP_SECRET
    source: symfony_secret
    env: prod
    required: true
  - key: ADMINISTERING_DATABASE_URL
    source: symfony_secret
    env: prod
    required: true

# Component-specific integration contracts are discovered through runtime-scope evidence.

administering_wave4:
  operation_entity: App\\Administering\\Entity\\AdministrationOperationRun
  ui_surface: easyadmin
  storage: system_sqlite_entity_manager

administering_wave6:
  operation_runner_contract: App\Administering\ServiceInterface\Operation\AdministrationOperationRunnerInterface
  permission_catalog_provider_token: authorization.permission_catalog
  messenger_payload_policy: operation_key_only
  secrets_payload_policy: no_secret_values_in_messenger_or_sqlite
