component: Administering
namespace: App\Administering
package: administering/admin
business_stem: Administration
ui_label: Admin
route_prefix: /admin
config_root: administering
database_prefix: administration_
storage:
  entity_manager: system
  primary_database: sqlite
  forbidden_database: postgres_user_data
ownership:
  identity_owner: Accessing
  authorization_owner: Rolling
  administration_owner: Administering

credentials:
  - key: APP_SECRET
    source: symfony_secret
    env: prod
    required: true
  - key: ADMINISTERING_DATABASE_URL
    source: symfony_secret
    env: prod
    required: true

integrations:
  accessing:
    owns: authentication_session_identity
    subject_prefix: 'accessing:account:'
  rolling:
    owns: authorization_acl_policy
    decision_contract: App\Rolling\ServiceInterface\Administration\RollingAdministrationPermissionDecisionServiceInterface
    field_decision_contract: App\Rolling\ServiceInterface\Administration\RollingFieldAccessDecisionServiceInterface
    field_access_apply_surface: administration_managing_field_access_mutation_apply
    field_view_profile_surface: administration_managing_field_view_profiles
    field_view_profile_priority_surface: administration_managing_field_view_profile_priority
    field_view_profile_review_surface: administration_managing_field_view_profile_edit
    field_view_profile_apply_surface: administration_managing_field_view_profile_apply
    field_visibility_explanation_surface: administration_managing_field_visibility_explanation
    managing_visibility_explanation_contract: App\Managing\ResolverInterface\Crud\ManageCrudFieldVisibilityExplanationResolverInterface
    managing_visibility_explanation_axes: [access, presentation, availability]
    field_visibility_inspection_surface: administration_managing_field_visibility_inspection
    managing_visibility_inspection_contract: App\Managing\InspectorInterface\Crud\ManageCrudFieldVisibilityInspectorInterface
    managing_external_access_resolver_contract: App\Managing\ResolverInterface\Crud\ManageCrudFieldExternalAccessResolverInterface
    managing_rolling_external_access_adapter: App\Managing\Resolver\Crud\ManageCrudRollingFieldExternalAccessResolver
    managing_rolling_external_access_readiness_surface: administration_managing_rolling_field_access_readiness
    managing_rolling_external_access_backend: rolling
    managing_rolling_external_access_failure_effect: deny
    managing_rolling_external_access_permission_key: managing.field.view
    managing_field_access_descriptor_validator: App\Managing\ValidatorInterface\Administration\ManagingFieldAccessPolicyDescriptorValidatorInterface
    managing_field_access_hardening_doc: docs/architecture/022-managing-field-access-catalog-hardening.adoc
    managing_field_visibility_readiness_doc: docs/architecture/023-managing-rolling-administering-field-visibility-readiness.adoc
    managing_profile_apply_contract: App\Managing\HandlerInterface\Crud\ManageCrudFieldUserProfileApplyHandlerInterface
    managing_profile_storage_entity: App\Managing\Entity\Crud\ManageCrudFieldViewProfileRule
    managing_profile_storage_entity_manager: system
    service_section_anchor_sync_operation: administration.service_section_anchors.sync
    service_section_anchor_sync_doc: docs/architecture/032-service-section-anchor-sync-operation.adoc

administering_wave4:
  operation_entity: App\\Administering\\Entity\\AdministrationOperationRun
  ui_surface: easyadmin
  storage: system_sqlite_entity_manager


administering_wave6:
  operation_runner_contract: App\Administering\ServiceInterface\Operation\AdministrationOperationRunnerInterface
  permission_catalog_provider_contract: App\Rolling\ServiceInterface\Administration\RollingAdministrationPermissionCatalogInterface
  messenger_payload_policy: operation_key_only
  secrets_payload_policy: no_secret_values_in_messenger_or_sqlite
